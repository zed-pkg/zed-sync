# fmctl schema-v1 manifest for the coalesced optimistic-write lifecycle.
schema_version = 1
project = "zed-sync"
model = "optimistic-write-lifecycle-v1"
language = "quint"
spec = "formal/write_lifecycle.qnt"
main = "write_lifecycle"
init = "init"
step = "step"
invariants = ["write_lifecycle_safety"]
witnesses = [
  "late_ack_preserves_newest_write",
  "retry_after_disconnect_reached",
  "server_wins_conflict_reached",
  "duplicate_ack_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
rust = "1.89.0"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 24

[verification]
backend = "tlc"
exhaustive_finite_model = true
