# fmctl schema-v1 manifest for the managed application/session lifecycle.
schema_version = 1
project = "zed-sync"
model = "app-lifecycle-v1"
language = "quint"
spec = "formal/app_lifecycle.qnt"
main = "app_lifecycle"
init = "init"
step = "step"
invariants = ["app_lifecycle_safety"]
witnesses = [
  "online_reached",
  "offline_reached",
  "failed_reached",
  "stale_completion_reached",
  "rejected_transition_reached",
  "failure_reconciliation_reached",
]

[toolchain]
quint = "0.32.0"
java = ">=17"
node = "22"
rust = "1.89.0"
npx = "npx"

[execution]
timeout_seconds = 600
max_output_bytes = 8388608
artifacts_dir = ".formal-artifacts"

[simulation]
backend = "typescript"
max_samples = 10000
max_steps = 24

[verification]
backend = "tlc"
exhaustive_finite_model = true
