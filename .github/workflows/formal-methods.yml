name: formal-methods

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  write-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # Keep these argv identical to `fmctl --dry-run`; the repository-local
      # schema-v1 manifest is the source of the claim and resource bounds.
      - name: Typecheck Quint specification
        run: |
          npx --yes --package=@informalsystems/quint@0.32.0 quint typecheck formal/write_lifecycle.qnt
          npx --yes --package=@informalsystems/quint@0.32.0 quint typecheck formal/app_lifecycle.qnt
      - name: Simulate invariants and reachability witnesses
        run: >-
          npx --yes --package=@informalsystems/quint@0.32.0 quint run
          formal/write_lifecycle.qnt
          --main=write_lifecycle
          --init=init
          --step=step
          --backend=typescript
          --max-samples=10000
          --max-steps=24
          --invariants write_lifecycle_safety
          --witnesses late_ack_preserves_newest_write retry_after_disconnect_reached server_wins_conflict_reached duplicate_ack_reached
      - name: Exhaustively verify the finite state space with TLC
        run: >-
          npx --yes --package=@informalsystems/quint@0.32.0 quint verify
          formal/write_lifecycle.qnt
          --main=write_lifecycle
          --init=init
          --step=step
          --backend=tlc
          --invariants write_lifecycle_safety
      - name: Simulate application lifecycle invariants and reachability
        run: >-
          npx --yes --package=@informalsystems/quint@0.32.0 quint run
          formal/app_lifecycle.qnt
          --main=app_lifecycle
          --init=init
          --step=step
          --backend=typescript
          --max-samples=10000
          --max-steps=24
          --invariants app_lifecycle_safety
          --witnesses online_reached offline_reached failed_reached stale_completion_reached rejected_transition_reached failure_reconciliation_reached
      - name: Exhaustively verify the finite application lifecycle with TLC
        run: >-
          npx --yes --package=@informalsystems/quint@0.32.0 quint verify
          formal/app_lifecycle.qnt
          --main=app_lifecycle
          --init=init
          --step=step
          --backend=tlc
          --invariants app_lifecycle_safety
