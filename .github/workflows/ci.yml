name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: cargo test
      - run: cargo fmt --check

  js-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm --prefix sdk install
      - run: npm --prefix sdk test
      - run: npm --prefix sdk run typecheck

  # Rebuild the browser wasm core FROM SOURCE and prove it still matches the
  # pure-JS mirror + the shared conformance fixture. This catches a committed
  # sdk/pkg going stale relative to src/, and guarantees the two cores agree.
  wasm-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-bindgen-action@20b33e20595891ab1a0ed73145d8a21fc96e7c29 # v0.2.0
        with:
          version: "0.2.114"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: bash sdk/build-wasm.sh
      - run: npm --prefix sdk install
      - run: node --test sdk/test/wasm-parity.test.mjs

  # Prove the shipped ESM SDK in the runtime it targets: IndexedDbStore + the
  # optimistic SyncClient exercised in real headless Chromium (durable rows +
  # write-queue across a reload, and reconcile over real IDB). MemoryStore is
  # covered off-DOM by js-sdk; this is the only browser-IDB path.
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
