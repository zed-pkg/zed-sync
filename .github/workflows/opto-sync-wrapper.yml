name: opto-sync wrapper contract

on:
  pull_request:
    paths:
      - '.zpkg.toml'
      - '.zpkg.lock'
      - 'opto-sync-adapter.json'
      - '.github/workflows/opto-sync-wrapper.yml'
  workflow_dispatch:
    inputs:
      live_install:
        description: Install and inspect the certified artifact from the committed lock
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZED_CLI_SHA: c636fb8f6b08695c6b4fe94e2481f4d57270b2d7
  ZED_INTERFACES_SHA: dc0e0a0620b9462817950b552d3d334a184b1cb1

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the staged wrapper and bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          root = pathlib.Path('.')
          manifest = tomllib.loads((root / '.zpkg.toml').read_text())
          lock = tomllib.loads((root / '.zpkg.lock').read_text())
          profile = json.loads((root / 'opto-sync-adapter.json').read_text())

          assert manifest['dependencies']['opto-sync/opto-sync-clients'] == '^0.2.0'
          assert manifest['install']['dir'] == 'zed_modules'
          assert profile['repository'] == 'zed-pkg/zed-sync'
          assert profile['e2eRepository'] == 'zed-pkg/zed-e2e'
          assert profile['implementationIssue'] == 'DEN-1153'
          assert set(profile['releaseGates']) == {'DEN-309', 'DEN-363'}
          assert all(profile['bootstrapBoundary'].values())
          assert profile['invariants']['zedBootstrapIndependent'] is True
          assert profile['wrapperRetains'] and profile['delegatesToOptoSync']

          expected = {
              'rust': ('opto-sync-client', 'clients/rust'),
              'typescript': ('@opto-sync/client', 'clients/ts'),
              'dart': ('opto_sync_client', 'clients/dart'),
          }
          for language, (package, suffix) in expected.items():
              adapter = profile['nativeAdapters'][language]
              assert adapter['package'] == package
              assert adapter['path'].endswith(suffix)
              assert '..' not in pathlib.PurePosixPath(adapter['path']).parts

          packages = lock.get('package', [])
          if profile['releaseState'] == 'blocked-until-certified-package-published':
              assert lock.get('version') == 1 and packages == []
          else:
              package = next(
                  p for p in packages
                  if p.get('org') == 'opto-sync' and p.get('name') == 'opto-sync-clients'
              )
              for field in ('version', 'sha256', 'size', 'format', 'vcs_tag', 'vcs_commit', 'source'):
                  assert package.get(field), f'missing lock field: {field}'
              assert len(package['sha256']) == 64

          serialized = json.dumps(profile).lower()
          for mutable in ('refs/heads/main', 'branch = "main"', 'latest'):
              assert mutable not in serialized
          PY

  live-install:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_install }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout pinned Zed sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: .tools/zed-cli
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: .tools/zed-interfaces
          persist-credentials: false

      - name: Build pinned Zed CLI with its pinned sibling interface crate
        run: cargo build --locked --release --manifest-path .tools/zed-cli/Cargo.toml --bin zed

      - name: Frozen-install and verify the Opto-Sync targets
        shell: bash
        run: |
          set -euo pipefail
          zed="$GITHUB_WORKSPACE/.tools/zed-cli/target/release/zed"
          "$zed" install --frozen --install-mode copy
          root="zed_modules/opto-sync/opto-sync-clients"
          test -f "$root/.zpkg.toml"
          test -f "$root/clients/rust/Cargo.toml"
          test -f "$root/clients/ts/package.json"
          test -f "$root/clients/dart/pubspec.yaml"
          python3 - <<'PY'
          import re
          import tomllib
          package = next(
              p for p in tomllib.loads(open('.zpkg.lock').read()).get('package', [])
              if p.get('org') == 'opto-sync' and p.get('name') == 'opto-sync-clients'
          )
          assert re.fullmatch(r'[0-9a-f]{64}', package['sha256'])
          assert package['size'] > 0
          assert package['vcs_tag']
          assert re.fullmatch(r'[0-9a-f]{40}', package['vcs_commit'])
          assert package['source']
          PY

  bootstrap-independence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned Zed package-plane sources only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_SHA }}
          path: .tools/zed-cli
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_SHA }}
          path: .tools/zed-interfaces
          persist-credentials: false

      - name: Prove the bootstrap graph excludes Opto-Sync and zed-sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          for manifest_path in (
              pathlib.Path('.tools/zed-cli/Cargo.toml'),
              pathlib.Path('.tools/zed-interfaces/Cargo.toml'),
          ):
              manifest = tomllib.loads(manifest_path.read_text())
              dependencies = {}
              for section in ('dependencies', 'build-dependencies', 'dev-dependencies'):
                  dependencies.update(manifest.get(section, {}))
              forbidden = [name for name in dependencies if 'opto' in name.lower() or name == 'zed-sync']
              assert forbidden == [], f'{manifest_path}: forbidden bootstrap dependencies: {forbidden}'
          PY
          cargo metadata --locked --no-deps --format-version 1 --manifest-path .tools/zed-cli/Cargo.toml > /dev/null
